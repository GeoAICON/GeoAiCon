<!DOCTYPE html>
<html>
<head>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #ccc; /* Checkboard-like feel */
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <script>
        const img = new Image();
        img.src = 'file:///c:/Users/Piyush Rawat/Desktop/piyuweb/GeoAiCon/public/logo.png';
        img.onload = () => {
            const canvas = document.getElementById('canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = img.width;
            canvas.height = img.height;
            ctx.drawImage(img, 0, 0);
            
            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const data = imageData.data;
            
            for (let i = 0; i < data.length; i += 4) {
                const r = data[i];
                const g = data[i+1];
                const b = data[i+2];
                
                // Average of RGB
                const avg = (r + g + b) / 3;
                
                // If it's very white, make it transparent
                // Using a softer threshold to keep the logo edges
                if (avg > 250) {
                    data[i+3] = 0;
                } else if (avg > 200) {
                    // Semi-transparent for edges
                    data[i+3] = Math.max(0, (255 - avg) * 2);
                }
            }
            ctx.putImageData(imageData, 0, 0);
            // Signal to subagent that we are ready
            document.body.setAttribute('data-ready', 'true');
        };
    </script>
</body>
</html>
